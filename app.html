<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MeadMath - honest mead math</title>
<style>
  :root { --bg:#151210; --card:#211c16; --line:#3a3226; --ink:#ece4d4; --dim:#a39880; --amber:#e8b23a; --warn:#e07a4a; --ok:#8fbf6a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width:920px; margin:0 auto; padding:28px 20px 80px; }
  h1 { font-size:30px; margin:6px 0 0; } h1 span { color:var(--amber); }
  nav { text-align:right; } nav a { color:var(--dim); text-decoration:none; font-size:14px; }
  nav a:hover { color:var(--amber); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px 22px; margin-top:22px; }
  .card h2 { margin:0 0 14px; font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); font-weight:600; }
  .row { display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end; }
  label { display:block; font-size:12px; color:var(--dim); margin-bottom:4px; }
  input, select { background:#171310; border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:9px 10px; font-size:15px; width:110px; }
  select { width:auto; min-width:170px; }
  .presets { margin-top:14px; display:flex; flex-wrap:wrap; gap:8px; }
  .presets button { background:#2a231a; color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:8px 14px; font-size:14px; cursor:pointer; }
  .presets button:hover { border-color:var(--amber); }
  .stat { display:inline-block; background:#171310; border:1px solid var(--line); border-radius:10px; padding:12px 18px; margin:0 10px 10px 0; min-width:130px; }
  .stat b { display:block; font-size:24px; color:var(--amber); }
  .stat small { color:var(--dim); font-size:12px; }
  .verdict { font-size:17px; margin:2px 0 14px; }
  .verdict b { color:var(--amber); }
  .verdict.warn b { color:var(--warn); }
  .fix { background:#2a1f14; border:1px solid #4a3a20; border-radius:10px; padding:12px 16px; margin-top:8px; font-size:15px; }
  .fix.ok { background:#1c2415; border-color:#3a4a28; }
  table { width:100%; border-collapse:collapse; margin-top:6px; font-size:15px; }
  td, th { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); }
  th { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.08em; }
  .note { color:var(--dim); font-size:13px; margin-top:10px; }
</style>
</head>
<body>
<div class="wrap">
  <nav><a href="index.html">about</a></nav>
  <h1>Mead<span>Math</span></h1>
  <div class="note" style="font-size:14px;">Weigh the honey, trust the hydrometer. Everything below is arithmetic you can check.</div>

  <div class="card">
    <h2>The batch</h2>
    <div class="row">
      <div><label>Batch size (gal)</label><input id="gal" type="number" min="0.5" step="0.5" value="1"></div>
      <div><label>Target original gravity</label><input id="og" type="number" min="1.010" max="1.160" step="0.005" value="1.090"></div>
      <div><label>Yeast</label><select id="yeast"></select></div>
      <div><label>Must temp (F)</label><input id="temp" type="number" min="50" max="90" step="1" value="68"></div>
      <div><label>Hydrometer reads</label><input id="hydro" type="number" step="0.001" placeholder="optional"></div>
    </div>
    <div class="presets" id="presets"></div>
    <div class="note">Honey runs about 35 gravity points per pound per gallon - your jar and mine differ by a point or two, and the hydrometer settles arguments.</div>
  </div>

  <div class="card">
    <h2>The recipe</h2>
    <div id="recipe"></div>
  </div>

  <div class="card">
    <h2>The ferment</h2>
    <div id="ferment"></div>
  </div>

  <div class="card">
    <h2>Backsweetening</h2>
    <div class="row">
      <div><label>Raise gravity by (points)</label><input id="bs" type="number" min="0" max="40" step="5" value="0"></div>
    </div>
    <div id="sweeten"></div>
  </div>
</div>
<script src="engine.js"></script>
<script>
var $ = function(id){ return document.getElementById(id); };
var yeastSel = $('yeast');
Object.keys(MeadEngine.YEASTS).forEach(function(k){
  var o = document.createElement('option'); o.value = k;
  o.textContent = MeadEngine.YEASTS[k].name + ' - ' + MeadEngine.YEASTS[k].tolerance + '%';
  yeastSel.appendChild(o);
});
yeastSel.value = 'd47';

var PRESETS = {
  'Session hydromel': { gal:1, og:1.045, yeast:'bread', temp:70, bs:0 },
  'Traditional 1 gal': { gal:1, og:1.090, yeast:'d47', temp:68, bs:0 },
  'Show mead 5 gal': { gal:5, og:1.110, yeast:'k1v', temp:66, bs:0 },
  'JAOM-ish': { gal:1, og:1.123, yeast:'bread', temp:72, bs:10 },
  'Semi-sweet 1 gal': { gal:1, og:1.090, yeast:'ec1118', temp:68, bs:15 }
};
var pb = $('presets');
Object.keys(PRESETS).forEach(function(name){
  var b = document.createElement('button'); b.textContent = name;
  b.onclick = function(){ var p = PRESETS[name];
    $('gal').value = p.gal; $('og').value = p.og.toFixed(3); $('yeast').value = p.yeast;
    $('temp').value = p.temp; $('bs').value = p.bs; $('hydro').value = ''; render(); };
  pb.appendChild(b);
});

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

function render(){
  var gal = parseFloat($('gal').value), og = parseFloat($('og').value);
  var temp = parseFloat($('temp').value), bs = parseFloat($('bs').value) || 0;
  var y = MeadEngine.YEASTS[yeastSel.value];
  if (!(gal > 0) || !(og > 1.005 && og <= 1.170)) { $('recipe').innerHTML = '<div class="note">Enter a sane batch size and gravity (1.010-1.160).</div>'; $('ferment').innerHTML=''; $('sweeten').innerHTML=''; return; }

  var lbs = MeadEngine.honeyLbsForOG(gal, og);
  var water = MeadEngine.waterGal(gal, lbs);
  var fg = MeadEngine.fgFromTolerance(og, y.tolerance);
  var abv = MeadEngine.abv(og, fg);
  var sw = MeadEngine.sweetness(fg);
  var nut = MeadEngine.nutrient(gal, Math.min(abv, y.tolerance));
  var tl = MeadEngine.timeline(temp);
  var nbot = MeadEngine.bottles(gal);

  var hydro = parseFloat($('hydro').value);
  var hydroHtml = '';
  if (hydro > 0.990 && hydro < 1.200) {
    var corr = MeadEngine.tempCorrectSG(hydro, temp);
    var off = Math.round((corr - hydro) * 1000);
    hydroHtml = '<div class="fix">At ' + temp + 'F your ' + hydro.toFixed(3) + ' reading is really <b>' + corr.toFixed(3) + '</b> (' + (off >= 0 ? '+' : '') + off + ' points). Warm must lies low, cold must lies high.</div>';
  }

  $('recipe').innerHTML =
    '<div class="verdict">For <b>' + gal + ' gal</b> at <b>' + og.toFixed(3) + '</b> you need <b>' + lbs + ' lb of honey</b>, topped up with about <b>' + water + ' gal of water</b>.</div>' +
    '<span class="stat"><b>' + lbs + ' lb</b><small>honey (' + (lbs*16) + ' oz)</small></span>' +
    '<span class="stat"><b>' + water + ' gal</b><small>water to top up</small></span>' +
    '<span class="stat"><b>' + nbot + '</b><small>750 ml bottles</small></span>' +
    hydroHtml +
    '<div class="note">Honey displaces its own volume (12 lb per gallon of it) - the water figure already accounts for that. Mix the honey into warm-not-hot water, then cool to pitching temp.</div>';

  var rows = nut.additions.map(function(g, i){ return '<tr><td>' + esc(nut.at[i]) + '</td><td>' + g + ' g</td></tr>'; }).join('');
  $('ferment').innerHTML =
    '<div class="verdict">With <b>' + esc(y.name) + '</b> (' + y.tolerance + '% tolerance) this finishes near <b>' + fg.toFixed(3) + '</b> - about <b>' + abv + '% ABV</b>, landing <b>' + sw + '</b>.</div>' +
    '<span class="stat"><b>' + abv + '%</b><small>expected ABV</small></span>' +
    '<span class="stat"><b>' + fg.toFixed(3) + '</b><small>expected FG (' + sw + ')</small></span>' +
    '<span class="stat"><b>' + tl.min + '-' + tl.max + ' wk</b><small>primary at ' + temp + 'F</small></span>' +
    '<div class="fix' + (temp < 60 ? '' : ' ok') + '">' + esc(tl.note) + '. Then age it: a ' + abv + '% mead wants at least ' + (abv >= 14 ? '6-12 months' : abv >= 10 ? '3-6 months' : '1-3 months') + ' before it stops tasting like rocket fuel.</div>' +
    '<h2 style="margin-top:16px;">Nutrient schedule (Fermaid-O, ' + nut.total + ' g total)</h2>' +
    '<table><tr><th>When</th><th>Dose</th></tr>' + rows + '</table>' +
    '<div class="note">Yeast without nitrogen makes fusels and sulfur. The 1/3 sugar break for this batch is around SG ' + (og - (og - fg) / 3).toFixed(3) + '.</div>';

  if (bs > 0) {
    var oz = MeadEngine.backsweetenOz(gal, bs);
    var newFg = fg + bs / 1000;
    $('sweeten').innerHTML = '<div class="fix">To raise gravity by ' + bs + ' points, dissolve <b>' + oz + ' oz of honey</b> (' + (oz/16).toFixed(2) + ' lb) after fermentation. New FG about <b>' + newFg.toFixed(3) + '</b> (' + MeadEngine.sweetness(newFg) + '). <b>Stabilize first</b> - potassium sorbate plus sulfite, or the yeast eats the new sugar too and the bottles become grenades.</div>';
  } else {
    $('sweeten').innerHTML = '<div class="note">Set a point bump above to see the honey dose. Always stabilize before backsweetening.</div>';
  }
}
['gal','og','yeast','temp','bs','hydro'].forEach(function(id){ $(id).addEventListener('input', render); });
render();
</script>
</body>
</html>
